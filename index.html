<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ssson house Picks — 집에서 사용한 제품을 모아둔 링크 아카이브">
  <title>ssson house Picks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="site-wrap">
    <header class="site-header">
      <div class="logo-area">
        <div class="logo-mark" aria-hidden="true">⌂</div>
        <p class="logo-sub">CURATED BY</p>
        <h1>ssson house <span>Picks</span></h1>
      </div>

      <div class="affiliate-notice">
        <p>오늘의집 큐레이터 활동을 통해 구매 시 일정액의 수수료를 제공받습니다.</p>
        <p>쿠팡 파트너스 활동을 통해 구매 시 일정액의 수수료를 제공받습니다.</p>
      </div>
    </header>

    <nav id="categoryTabs" class="category-tabs" aria-label="상품 카테고리"></nav>

    <section class="sort-tabs" aria-label="상품 정렬">
      <button class="sort-btn active" data-sort="newest">최신순 ★</button>
      <button class="sort-btn" data-sort="name">이름순 ↑</button>
    </section>

    <section id="productGrid" class="product-grid" aria-live="polite"></section>

    <div id="emptyState" class="empty-state" hidden>
      조건에 맞는 제품이 없어요.
    </div>

    <footer>© <span id="year"></span> ssson house Picks</footer>
  </main>

  <template id="productTemplate">
    <article class="product-card">
      <p class="brand"></p>
      <div class="image-area">
        <img class="product-image" loading="lazy" alt="">
      </div>
      <div class="product-copy">
        <h2 class="name"></h2>
        <p class="note"></p>
        <div class="shop-links">
          <a class="shop-link todayhouse" target="_blank" rel="noopener sponsored">
            <span class="shop-icon todayhouse-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 11.2 12 4l8 7.2v8.3a.5.5 0 0 1-.5.5h-5.2v-5.7H9.7V20H4.5a.5.5 0 0 1-.5-.5z"/></svg>
            </span>
            <span class="shop-text"><small>오늘의집</small><strong>보러 가기</strong></span>
            <span class="arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M8 16 16 8M9 8h7v7"/></svg>
            </span>
          </a>
          <a class="shop-link coupang" target="_blank" rel="noopener sponsored">
            <span class="shop-icon coupang-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M17.2 7.2A7 7 0 1 0 17.2 16.8"/></svg>
            </span>
            <span class="shop-text"><small>쿠팡</small><strong>보러 가기</strong></span>
            <span class="arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M8 16 16 8M9 8h7v7"/></svg>
            </span>
          </a>
        </div>
      </div>
    </article>
  </template>

  <script src="./script.js"></script>
</body>
</html>
